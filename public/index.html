<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Herdr Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">LOCAL AGENT CONTROL PLANE</div>
          <h1>Herdr Manager</h1>
          <p>See every workspace, understand agent state, and launch Copilot sessions where work lives.</p>
        </div>
        <div class="connection">
          <span id="connectionDot" class="connection-dot"></span>
          <span id="connectionText">Connecting</span>
          <button id="refreshButton" class="icon-button" title="Refresh">↻</button>
        </div>
      </header>

      <section id="stats" class="stats" aria-label="Session summary"></section>

      <section class="section-heading">
        <div>
          <h2>Workspaces</h2>
          <p id="lastUpdated">Waiting for Herdr…</p>
        </div>
        <button id="spawnTopButton" class="primary-button">+ Spawn Copilot</button>
      </section>

      <section id="workspaceGrid" class="workspace-grid">
        <div class="loading-card">Loading Herdr session…</div>
      </section>
    </main>

    <dialog id="spawnDialog">
      <form id="spawnForm">
        <div class="dialog-header">
          <div>
            <div class="eyebrow">NEW SESSION</div>
            <h2>Spawn Copilot</h2>
          </div>
          <button type="button" class="icon-button close-dialog" aria-label="Close">×</button>
        </div>
        <label>
          Workspace
          <select id="spawnWorkspace" name="workspaceId" required></select>
        </label>
        <label>
          Agent name
          <input name="name" placeholder="Optional, e.g. api-reviewer" pattern="[a-z][a-z0-9_-]{0,31}" />
        </label>
        <label>
          Task
          <textarea name="task" rows="6" placeholder="Describe the work for this Copilot session…"></textarea>
        </label>
        <label>
          Tab label
          <input name="tabLabel" placeholder="Optional" />
        </label>
        <label class="checkbox-row">
          <input name="focus" type="checkbox" />
          Focus the new session after launch
        </label>
        <div id="spawnError" class="form-error" role="alert"></div>
        <div class="dialog-actions">
          <button type="button" class="secondary-button close-dialog">Cancel</button>
          <button id="spawnSubmit" type="submit" class="primary-button">Spawn session</button>
        </div>
      </form>
    </dialog>

    <dialog id="outputDialog" class="output-dialog">
      <div class="dialog-header">
        <div>
          <div class="eyebrow">RECENT TERMINAL OUTPUT</div>
          <h2 id="outputTitle">Agent output</h2>
        </div>
        <button type="button" class="icon-button close-output" aria-label="Close">×</button>
      </div>
      <pre id="outputContent">Loading…</pre>
    </dialog>

    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
